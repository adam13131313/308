var PLAN_DATA = [

  { week:7, phase:"Build", dates:"08 Jun - 14 Jun", planned:62, sessions:[["Easy 7km","5:15-5:30/km"],["Cruise Intervals 14km","3km w/u, 4x8min @ 4:12 (90s jog), w/d"],["Rest",""],["Easy 10km + strides","5:15-5:30/km + 8x80m strides"],["Long Run 24km","5:00-5:30/km steady"],["Easy 7km","5:15-5:30/km"],["Rest",""]] },

  { week:10, phase:"Peak", dates:"29 Jun - 05 Jul", planned:66, sessions:[["Easy 7km","5:15-5:30/km"],["Cruise Intervals 14km","3km w/u, 4x8min @ 4:10 (90s jog), w/d"],["Rest",""],["Intervals 10km","2km w/u, 8x800m @ 3:50 (90s jog), w/d"],["Long Run 28km (MP)","easy, last 7km @ 4:29 MP"],["Easy 7km","5:15-5:30/km"],["Rest",""]] },
  { week:11, phase:"Peak", dates:"06 Jul - 12 Jul", planned:71, sessions:[["Easy 7km","5:15-5:30/km"],["MP Run 17km","3km w/u, 14km @ 4:29, w/d"],["Rest",""],["Cruise Intervals 10km","2km w/u, 3x10min @ 4:10 (90s jog), w/d"],["Long Run 30km (MP)","easy, last 10km @ 4:29 MP"],["Easy 7km","5:15-5:30/km"],["Rest",""]] },
  { week:12, phase:"Peak", dates:"13 Jul - 19 Jul", planned:48, sessions:[["Easy 7km","5:15-5:30/km"],["Easy 10km + strides","5:15-5:30/km + strides"],["Rest",""],["Easy 7km","5:15-5:30/km"],["Long Run 17km","5:00-5:30/km steady"],["Easy 7km","5:15-5:30/km"],["Rest",""]] },
  { week:13, phase:"Reduced", dates:"20 Jul - 26 Jul", planned:34, sessions:[["Easy 7km","5:15-5:30/km"],["Tempo 10km","2km w/u, 20min @ 4:15, w/d"],["Rest",""],["Rest",""],["Easy 7km","5:15-5:30/km"],["Easy 10km","5:15-5:30/km"],["Rest",""]] },
  { week:14, phase:"Reduced", dates:"27 Jul - 02 Aug", planned:38, sessions:[["Easy 7km","5:15-5:30/km"],["Easy 7km","5:15-5:30/km"],["Rest",""],["Tempo 7km","1km w/u, 15min @ 4:15, w/d"],["Easy 7km","5:15-5:30/km"],["Easy 10km","5:15-5:30/km"],["Rest",""]] },
  { week:15, phase:"Reduced", dates:"03 Aug - 09 Aug", planned:28, sessions:[["Easy 7km","5:15-5:30/km"],["Easy 7km","5:15-5:30/km"],["Rest",""],["Tempo 7km","1km w/u, 15min @ 4:15, w/d"],["Easy 7km","5:15-5:30/km"],["Rest",""],["Rest",""]] },
  { week:16, phase:"Sharpen", dates:"10 Aug - 16 Aug", planned:51, sessions:[["Easy 7km","5:15-5:30/km"],["Cruise Intervals 10km","2km w/u, 3x8min @ 4:08 (90s jog), w/d"],["Rest",""],["MP Run 10km","2km w/u, 6km @ 4:29, w/d"],["Long Run 17km","5:00-5:30/km steady"],["Easy 7km","5:15-5:30/km"],["Rest",""]] },
  { week:17, phase:"Taper", dates:"17 Aug - 23 Aug", planned:38, sessions:[["Easy 7km","5:15-5:30/km"],["Easy 7km + strides","5:15-5:30/km + 6x80m strides"],["Rest",""],["MP 7km","1km w/u, 4km @ 4:29, w/d"],["Easy 10km","5:15-5:30/km"],["Easy 7km","5:15-5:30/km"],["Rest",""]] },
  { week:18, phase:"Taper", dates:"24 Aug - 30 Aug", planned:21, sessions:[["Easy 7km","5:15-5:30/km relaxed"],["Easy 7km + strides","5:15-5:30/km + 4x80m strides"],["Rest",""],["Shakeout 7km","very easy + 4 strides"],["Rest",""],["Rest",""],["RACE DAY!","Target 3:08:59 @ 4:29/km. Negative split!"]] },
];

var GOAL_PACE_SEC = 269; // 4:29/km marathon goal pace
var DAY_NAMES = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
var RACE_DATE = new Date(2026,7,30);
var PHASE = {
  Base:{c:"#4a9eff",bg:"#142a44"}, Build:{c:"#3ddc84",bg:"#143322"},
  Peak:{c:"#ff9100",bg:"#332211"}, Reduced:{c:"#b388ff",bg:"#261044"},
  Sharpen:{c:"#ffd600",bg:"#33301a"}, Taper:{c:"#ff4081",bg:"#330f22"},
};
var RUNS_KEY = "sydney-marathon-runs";
var METRICS_KEY = "sydney-marathon-metrics";
var PLAN_KEY = "sydney-marathon-plan";
var MISSED_KEY = "sydney-marathon-missed";

// ============================================================
// STATE - personal data loaded from localStorage only
// ============================================================
var runs = {};
var metrics = [];
var view = "plan";
var openWeek = null;
var logDate = null;
var detailDate = null;
var dataPanel = false;
var planSessions = null;   // 18x7 grid of [name,detail] - user's arrangement, persisted
var missed = {};           // keyed by date string -> true
var rearrange = false;     // drag-to-reorder mode

function clonePlan() { return PLAN_DATA.map(function(w){ return w.sessions.map(function(s){ return [s[0], s[1]]; }); }); }
function getWeekSessions(wi) { return (planSessions && planSessions[wi]) ? planSessions[wi] : PLAN_DATA[wi].sessions; }
function loadAll() {
  runs = {};
  metrics = [];
  missed = {};
  planSessions = null;
  try { var r = localStorage.getItem(RUNS_KEY); if (r) runs = JSON.parse(r); } catch(e) {}
  try { var m = localStorage.getItem(METRICS_KEY); if (m) metrics = JSON.parse(m); } catch(e) {}
  try { var ms = localStorage.getItem(MISSED_KEY); if (ms) missed = JSON.parse(ms); } catch(e) {}
  try { var p = localStorage.getItem(PLAN_KEY); if (p) { var pp = JSON.parse(p); if (Array.isArray(pp) && pp.length === PLAN_DATA.length) planSessions = pp; } } catch(e) {}
  if (!planSessions) planSessions = clonePlan();
}
function saveRuns() { try { localStorage.setItem(RUNS_KEY, JSON.stringify(runs)); } catch(e) {} }
function saveMetrics() { try { localStorage.setItem(METRICS_KEY, JSON.stringify(metrics)); } catch(e) {} }
function saveMissed() { try { localStorage.setItem(MISSED_KEY, JSON.stringify(missed)); } catch(e) {} }
function savePlan() { try { localStorage.setItem(PLAN_KEY, JSON.stringify(planSessions)); } catch(e) {} }

// ============================================================
// HELPERS
// ============================================================
function dateKey(wi, di) {
  var d = new Date(2026, 3, 27 + wi*7 + di);
  return d.getFullYear() + "-" + ("0"+(d.getMonth()+1)).slice(-2) + "-" + ("0"+d.getDate()).slice(-2);
}
function paceToSec(p) {
  if (!p) return null;
  var x = (""+p).split(":");
  if (x.length !== 2) return null;
  return parseInt(x[0])*60 + parseInt(x[1]);
}
function isEasy(s) { return s && (s.indexOf("Easy")===0 || s.indexOf("Long Run")===0 || s.indexOf("Shakeout")===0); }
function weekKm(wi) {
  var t=0,n=0;
  for (var d=0;d<7;d++){ var r=runs[dateKey(wi,d)]; if(r&&r.km){t+=r.km;n++;} }
  return { km: Math.round(t*10)/10, n:n };
}
function currentWeek() { return Math.floor((new Date() - new Date(2026,3,27)) / (7*86400000)); }
function esc(s){ return (""+(s||"")).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function ltPct(ltPace) {
  var ltSec = paceToSec(ltPace);
  if (!ltSec) return null;
  // % of LT speed = (LT pace sec / goal pace sec) since speed is inverse of pace
  return Math.round((ltSec / GOAL_PACE_SEC) * 1000) / 10;
}
function latestMetric() { return metrics.length ? metrics[metrics.length-1] : null; }
function fmtPace(sec) { var m=Math.floor(sec/60), s=sec%60; return m+":"+("0"+s).slice(-2); }

// ============================================================
// RENDER
// ============================================================
function render() {
  var totalKm=0, totalRuns=0;
  for (var k in runs){ if(runs[k].km){ totalKm+=runs[k].km; totalRuns++; } }
  totalKm = Math.round(totalKm);
  var days = Math.ceil((RACE_DATE - new Date())/86400000);
  var lm = latestMetric();
  var pct = lm ? ltPct(lm.lt) : null;

  var h = '';
  h += '<div class="header">';
  h += '<div class="title">SYDNEY <span style="color:#ff5c35">3:08:59</span> <span style="font-size:10px;color:#eef2f6;font-weight:400">30 AUG 2026</span></div>';
  h += '<div class="nav">';
  ["plan","chart","metrics","kb"].forEach(function(v){
    h += '<button class="'+(view===v?'active':'')+'" onclick="setView(\''+v+'\')">'+v+'</button>';
  });
  h += '<button class="gear" onclick="toggleData()">DATA</button>';
  h += '</div></div>';

  var toGo = days > 0 ? (Math.floor(days/7) + "W" + (days%7) + "D") : "0";
  var stats = [
    {l:"To go", v:toGo, c:"#ff5c35"},
    {l:"Goal MP", v:fmtPace(GOAL_PACE_SEC), c:"#ff5c35"},
    {l:"Total", v:totalKm+"km", c:"#ffffff"},
    {l:"Runs", v:totalRuns, c:"#ffffff"},
    {l:"VO2", v:lm?lm.vo2:"-", c:"#4a9eff"},
    {l:"MP%", v:pct?pct:"-", c:(pct&&pct<=93)?"#3ddc84":"#ff9100"},
  ];
  h += '<div class="stats">';
  stats.forEach(function(s){ h += '<div class="stat"><div class="stat-label">'+s.l+'</div><div class="stat-value" style="color:'+s.c+'">'+s.v+'</div></div>'; });
  h += '</div>';

  h += '<div class="content">';
  if (view==="plan") h += renderPlan(currentWeek());
  if (view==="chart") h += renderChart();
  if (view==="metrics") h += renderMetrics();
  if (view==="kb") h += renderKB();
  h += '</div>';

  if (logDate) h += renderLog();
  if (detailDate) h += renderDetail();
  if (dataPanel) h += renderDataPanel();

  document.getElementById("app").innerHTML = h;
  if (rearrange) {
    var _rb=document.querySelector('.rearrange-bar'), _hd=document.querySelector('.header');
    if (_rb && _hd) { _rb.style.position='sticky'; _rb.style.top=_hd.offsetHeight+'px'; _rb.style.zIndex='9'; }
  }
}

function renderPlan(cw) {
  var h = '';
  h += '<div class="rearrange-bar'+(rearrange?'':' off')+'" onclick="toggleRearrange()">'
     + (rearrange ? '✓ DONE — drag the ⠿ handle to swap any two days (across weeks too)' : '↕ REARRANGE SCHEDULE')
     + '</div>';
  var openFrom = Math.max(0, Math.min(PLAN_DATA.length-1, cw));
  PLAN_DATA.forEach(function(wk, wi){
    var st = weekKm(wi);
    var pct = st.km>0 ? Math.round(st.km/wk.planned*100) : 0;
    var ps = PHASE[wk.phase] || PHASE.Base;
    var pctColor = pct>=95?"#3ddc84":pct>=80?"#ff9100":"#ff5c35";
    var isOpen = rearrange ? (wi >= openFrom) : (openWeek===wi);
    var isCur = wi===cw;
    var cls = "week-head" + (isOpen?" open":"") + (isCur&&!isOpen?" current":"");
    var border = isOpen ? "border-color:"+ps.c+"44;" : "";
    var headClick = rearrange ? '' : ' onclick="toggleWeek('+wi+')"';
    h += '<div id="wk'+wi+'" class="'+cls+'" style="'+border+'"'+headClick+'>';
    h += '<span style="color:'+(isCur?ps.c:"#eef2f6")+';font-size:10px;min-width:24px;font-weight:700">W'+wk.week+'</span>';
    h += '<span class="phase-tag" style="background:'+ps.bg+';color:'+ps.c+'">'+wk.phase+'</span>';
    if (isCur) h += '<span style="font-size:8px;color:'+ps.c+'">NOW</span>';
    h += '<span style="flex:1"></span>';
    if (st.km>0) {
      h += '<span style="font-size:10px;font-weight:700;color:#ffffff">'+st.km+'km</span>';
      h += '<span style="font-size:8px;color:#eef2f6">of '+wk.planned+'</span>';
      h += '<span style="font-size:9px;font-weight:700;color:'+pctColor+'">'+pct+'%</span>';
    } else {
      h += '<span style="font-size:10px;color:#d4dce6">'+wk.planned+'km</span>';
    }
    if (!rearrange) h += '<span style="font-size:10px;color:#eef2f6;margin-left:4px">'+(isOpen?"&minus;":"+")+'</span>';
    h += '</div>';
    if (isOpen) {
      h += '<div class="week-body" style="border:1px solid '+ps.c+'44;border-top:none">';
      h += '<div style="font-size:8px;color:#eef2f6;margin-bottom:6px">'+wk.dates+'</div>';
      var wkMissed = 0;
      getWeekSessions(wi).forEach(function(sessArr, di){
        var sess = sessArr[0], detail = sessArr[1];
        var dk = dateKey(wi, di);
        var run = runs[dk];
        var isRest = sess==="Rest";
        var isRace = sess==="RACE DAY!";
        var isMissed = !run && !isRest && !!missed[dk];
        if (isMissed) wkMissed++;
        var tooFast = false;
        if (run && run.pace && isEasy(sess)) { var sec=paceToSec(run.pace); if(sec!==null&&sec<310) tooFast=true; }
        var dcls = "day" + (run?" run":"") + (tooFast?" fast":"") + (isMissed?" missed":"") + (isRest&&!run?" rest":"") + (rearrange?" rearranging":" loggable");
        var attrs = ' data-cell data-w="'+wi+'" data-d="'+di+'"' + (isRace?' data-lock="1"':'');
        var clickAttr = rearrange ? '' : ' onclick="openDetail(event,\'' + dk + '\')"';
        h += '<div class="'+dcls+'"'+attrs+clickAttr+'>';
        if (rearrange) h += '<span class="drag-handle"'+(isRace?' style="background:#1a1f2b;color:#3a4452"':' data-drag')+'>⠿</span>';
        h += '<span style="font-size:9px;color:#eef2f6;font-weight:700;min-width:24px;padding-top:1px">'+DAY_NAMES[di]+'</span>';
        h += '<span style="flex:1"><span class="sess-name" style="font-size:9px;color:'+(isRest?"#d4dce6":"#eef2f6")+';display:block">'+esc(sess)+'</span>';
        if (detail) h += '<span style="font-size:8px;color:'+(isRace?"#ff5c35":"#d4dce6")+';display:block;margin-top:1px">'+esc(detail)+'</span>';
        h += '</span>';
        if (run) {
          h += '<span style="display:flex;align-items:center;gap:5px;padding-top:1px">';
          if (tooFast) h += '<span style="font-size:8px;color:#ff9100">FAST</span>';
          h += '<span style="font-size:12px;font-weight:700;color:'+(tooFast?"#ff9100":"#3ddc84")+'">'+run.km+'</span>';
          if (run.pace) h += '<span style="font-size:8px;color:#eef2f6">'+run.pace+'</span>';
          if (run.hr) h += '<span style="font-size:8px;color:#4a9eff">HR'+run.hr+'</span>';
          h += '</span>';
        } else if (isMissed) {
          h += '<span style="font-size:8px;color:#ff4d4d;font-weight:700;padding-top:1px">MISSED</span>';
        } else if (!rearrange) {
          h += '<span style="font-size:8px;color:#d4dce6;padding-top:1px">+ log</span>';
        }
        h += '</div>';
      });
      var sumBits = [];
      if (st.km>0) sumBits.push(st.n+' runs · '+st.km+'km of '+wk.planned+'km · '+pct+'%');
      if (wkMissed>0) sumBits.push('<span style="color:#ff4d4d">'+wkMissed+' missed</span>');
      if (sumBits.length) h += '<div style="margin-top:6px;padding:4px 6px;font-size:9px;color:#eef2f6;border-top:1px solid '+ps.c+'22">'+sumBits.join(' · ')+'</div>';
      h += '</div>';
    }
  });
  return h;
}

function renderChart() {
  var hasData = false;
  for (var k in runs){ if(runs[k].km){ hasData=true; break; } }
  if (!hasData) return '<div class="empty">No runs logged yet.<br>Log runs in the Plan tab, or import your data via the gear icon.</div>';

  var cum=[], cp=0, ca=0;
  for (var i=0;i<18;i++){ cp+=PLAN_DATA[i].planned; var s=weekKm(i); if(s.km>0)ca+=s.km; cum.push({w:i+1,p:cp,a:s.km>0?ca:null}); }
  var mx = Math.max.apply(null, cum.map(function(d){return d.p;}));
  var pp = cum.map(function(d,i){return (28+i*(302/17))+","+(155-(d.p/mx)*140);}).join(" ");
  var af = cum.filter(function(d){return d.a!==null;});
  var ap = af.map(function(d,i){return (28+i*(302/17))+","+(155-(d.a/mx)*140);}).join(" ");

  var h = '<div class="card"><div class="card-title">Cumulative KM</div><svg viewBox="0 0 340 170">';
  [0,200,400,600,800].forEach(function(v){ var y=155-(v/mx)*140; h+='<line x1="28" y1="'+y+'" x2="330" y2="'+y+'" stroke="#3a4452" stroke-width="0.5"/><text x="25" y="'+(y+3)+'" fill="#eef2f6" font-size="6" text-anchor="end">'+v+'</text>'; });
  h += '<polyline fill="none" stroke="#9aa4b4" stroke-width="1.5" stroke-dasharray="4,3" points="'+pp+'"/>';
  h += '<polyline fill="none" stroke="#3ddc84" stroke-width="2" points="'+ap+'"/>';
  af.forEach(function(d,i){ h+='<circle cx="'+(28+i*(302/17))+'" cy="'+(155-(d.a/mx)*140)+'" r="2.5" fill="#3ddc84"/>'; });
  cum.forEach(function(d,i){ h+='<text x="'+(28+i*(302/17))+'" y="166" fill="#eef2f6" font-size="5.5" text-anchor="middle">'+d.w+'</text>'; });
  h += '</svg><div style="display:flex;gap:10px;justify-content:center;margin-top:4px;font-size:8px;color:#eef2f6"><span>- - Planned</span><span style="color:#3ddc84">--- Actual</span></div></div>';

  var pts = [];
  Object.keys(runs).sort().forEach(function(k){ var r=runs[k]; if(r.hr&&r.km>=7) pts.push(r.hr); });
  if (pts.length>=2) {
    var minH=120, maxH=165;
    var hp = pts.map(function(v,i){ return (30+i*(300/(pts.length-1)))+","+(110-((v-minH)/(maxH-minH))*95); }).join(" ");
    h += '<div class="card"><div class="card-title">Easy-Run HR Trend</div><div style="font-size:8px;color:#eef2f6;margin-bottom:8px">Lower = improving fitness (runs 7km+)</div><svg viewBox="0 0 340 125">';
    [130,145,160].forEach(function(v){ var y=110-((v-minH)/(maxH-minH))*95; h+='<line x1="30" y1="'+y+'" x2="335" y2="'+y+'" stroke="#3a4452" stroke-width="0.5"/><text x="27" y="'+(y+3)+'" fill="#eef2f6" font-size="6" text-anchor="end">'+v+'</text>'; });
    h += '<polyline fill="none" stroke="#4a9eff" stroke-width="2" points="'+hp+'"/>';
    pts.forEach(function(v,i){ h+='<circle cx="'+(30+i*(300/(pts.length-1)))+'" cy="'+(110-((v-minH)/(maxH-minH))*95)+'" r="2.5" fill="#4a9eff"/>'; });
    h += '</svg></div>';
  }

  h += '<div class="card"><div class="card-title">Weekly Volume</div><svg viewBox="0 0 340 110">';
  PLAN_DATA.forEach(function(wk,i){ var s=weekKm(i); var bw=14; var x=10+i*(326/18); var mw=80; var hpl=(wk.planned/mw)*90; var ha=s.km>0?(s.km/mw)*90:0; var ps=PHASE[wk.phase]||PHASE.Base;
    h+='<rect x="'+x+'" y="'+(98-hpl)+'" width="'+bw+'" height="'+hpl+'" fill="#1a1f2b" rx="2"/>'; if(ha>0) h+='<rect x="'+x+'" y="'+(98-ha)+'" width="'+bw+'" height="'+ha+'" fill="'+ps.c+'" rx="2" opacity="0.6"/>'; h+='<text x="'+(x+bw/2)+'" y="108" fill="#eef2f6" font-size="5.5" text-anchor="middle">'+(i+1)+'</text>'; });
  h += '</svg></div>';
  return h;
}

function renderLog() {

function renderDetail() {

  var wkNum="", session="", detail="", phaseColor="#3ddc84";
  for (var wi=0; wi<18; wi++){ for (var di=0; di<7; di++){ if (dateKey(wi,di)===detailDate){ wkNum="Week "+PLAN_DATA[wi].week+" - "+PLAN_DATA[wi].phase; session=getWeekSessions(wi)[di][0]; detail=getWeekSessions(wi)[di][1]; var ps=PHASE[PLAN_DATA[wi].phase]; if(ps)phaseColor=ps.c; } } }
  var tooFast=false;
  if (run && run.pace && isEasy(session)) { var sec=paceToSec(run.pace); if(sec!==null&&sec<310) tooFast=true; }

  var h = '<div class="modal-bg" onclick="closeDetail()"></div><div class="detail-modal">';
  h += '<div class="detail-date">'+dateLabel+'</div><div style="font-size:10px;color:#eef2f6;margin-bottom:10px">'+wkNum+'</div>';

function setView(v){ view=v; render(); }
function toggleWeek(wi){ openWeek=(openWeek===wi)?null:wi; render(); }
function openDetail(e, dk){ e.stopPropagation(); detailDate=dk; render(); }
function closeDetail(){ detailDate=null; render(); }
function editFromDetail(){ var dk=detailDate; detailDate=null; logDate=dk; render(); var el=document.getElementById("f-km"); if(el)el.focus(); }
function openLog(e, dk){ e.stopPropagation(); logDate=dk; render(); var el=document.getElementById("f-km"); if(el)el.focus(); }
function closeLog(){ logDate=null; render(); }
function saveLog(){
  var km=parseFloat(document.getElementById("f-km").value);
  if(!km){ closeLog(); return; }
  runs[logDate]={ km:km, pace:document.getElementById("f-pace").value, hr:document.getElementById("f-hr").value?parseInt(document.getElementById("f-hr").value):null, note:document.getElementById("f-note").value };
  if (missed[logDate]) { delete missed[logDate]; saveMissed(); }
  saveRuns(); logDate=null; render();
}
function deleteRun(){ if(runs[logDate]){ delete runs[logDate]; saveRuns(); } logDate=null; render(); }

function toggleRearrange(){
  rearrange=!rearrange; logDate=null; detailDate=null; dataPanel=false;
  var cw=Math.max(0,Math.min(PLAN_DATA.length-1,currentWeek()));
  if(!rearrange) openWeek=cw;   // leave the current week open after finishing
  render();
  scrollToWeek(cw);
}
function scrollToWeek(wi){
  var el=document.getElementById('wk'+wi); if(!el) return;
  var hdr=document.querySelector('.header');
  var hh=hdr?hdr.offsetHeight:110;
  if(rearrange){ var rb=document.querySelector('.rearrange-bar'); if(rb) hh+=rb.offsetHeight; }
  var top=el.getBoundingClientRect().top + window.pageYOffset - hh - 6;
  window.scrollTo(0, top<0?0:top);
}
function markMissed(){ if(detailDate){ missed[detailDate]=true; saveMissed(); } render(); }
function unmarkMissed(){ if(detailDate){ delete missed[detailDate]; saveMissed(); } render(); }
function resetPlan(){
  if(!confirm("Reset all schedule rearrangements back to the default plan?\n\nYour logged runs and missed flags are NOT affected.")) return;
  planSessions=clonePlan(); savePlan(); dataPanel=false; showToast("Schedule reset to default"); render();
}

// ---- drag to rearrange: swaps the contents of two day cells (any weeks) ----
var drag=null;
function cellFromPoint(x,y){
  var el=document.elementFromPoint(x,y);
  while(el && el!==document.body){
    if(el.dataset && typeof el.dataset.w!=="undefined" && typeof el.dataset.d!=="undefined") return el;
    el=el.parentNode;
  }
  return null;
}
function onPointerDown(e){
  if(!rearrange || !e.target.closest) return;
  var hd=e.target.closest('[data-drag]'); if(!hd) return;
  var cell=hd.closest('[data-cell]'); if(!cell || cell.dataset.lock==="1") return;
  e.preventDefault();
  var rect=cell.getBoundingClientRect();
  drag={ fromW:+cell.dataset.w, fromD:+cell.dataset.d, src:cell, target:null, offY:e.clientY-rect.top };
  var clone=cell.cloneNode(true);
  clone.style.cssText='position:fixed;left:'+rect.left+'px;width:'+rect.width+'px;top:'+(e.clientY-drag.offY)+'px;z-index:50;opacity:0.95;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,0.65);background:#142a1f;border-radius:4px;';
  drag.clone=clone; document.body.appendChild(clone);
  cell.style.opacity='0.25';
  document.addEventListener('pointermove', onPointerMove, {passive:false});
  document.addEventListener('pointerup', onPointerUp);
  document.addEventListener('pointercancel', onPointerUp);
}
function onPointerMove(e){
  if(!drag) return;
  e.preventDefault();
  drag.clone.style.top=(e.clientY-drag.offY)+'px';
  var vh=window.innerHeight;
  if(e.clientY<110) window.scrollBy(0,-14);
  else if(e.clientY>vh-90) window.scrollBy(0,14);
  if(drag.target) drag.target.style.outline='';
  var t=cellFromPoint(e.clientX,e.clientY);
  if(t && t!==drag.src && t.dataset.lock!=="1"){ t.style.outline='2px solid #3ddc84'; t.style.outlineOffset='-1px'; drag.target=t; }
  else drag.target=null;
}
function onPointerUp(){
  if(!drag) return;
  document.removeEventListener('pointermove', onPointerMove);
  document.removeEventListener('pointerup', onPointerUp);
  document.removeEventListener('pointercancel', onPointerUp);
  if(drag.clone) drag.clone.remove();
  var t=drag.target;
  if(t){
    var tw=+t.dataset.w, td=+t.dataset.d;
    var a=planSessions[drag.fromW][drag.fromD];
    planSessions[drag.fromW][drag.fromD]=planSessions[tw][td];
    planSessions[tw][td]=a;
    savePlan();
  }
  drag=null; render();
}

function weekFromDate(dateStr){
  var d = new Date(dateStr+"T00:00:00");
  var start = new Date(2026,3,27);
  var wk = Math.floor((d - start)/(7*86400000)) + 1;
  if (wk < 1) wk = 1;
  if (wk > 18) wk = 18;
  return wk;
}
function addMetric(){
  var dateStr=document.getElementById("m-date").value;
  var vo2=parseInt(document.getElementById("m-vo2").value);
  var lt=document.getElementById("m-lt").value;
  var ltHr=parseInt(document.getElementById("m-hr").value);
  if(!dateStr||!lt){ showToast("Need date and LT pace"); return; }
  var wk=weekFromDate(dateStr);
  // replace existing reading for that week if present
  metrics=metrics.filter(function(m){ return m.week!==wk; });
  metrics.push({ week:wk, vo2:vo2||null, lt:lt, ltHr:ltHr||null });
  metrics.sort(function(a,b){ return a.week-b.week; });
  saveMetrics(); render();
  showToast("Added reading for week "+wk);
}

function toggleData(){ dataPanel=!dataPanel; render(); }
function closeData(){ dataPanel=false; render(); }
function importJson(){
  var txt=document.getElementById("data-json").value.trim();
  if(!txt){ showToast("Paste your data first"); return; }
  var obj=null;
  try {
    obj=JSON.parse(txt);
  } catch(e){
    // Forgiving: if multiple JSON blocks got pasted, use the last complete one
    var lastOpen=txt.lastIndexOf('{\n');
    if(lastOpen<0) lastOpen=txt.indexOf('{', txt.indexOf('}')+1);
    if(lastOpen>0){
      try { obj=JSON.parse(txt.substring(lastOpen)); } catch(e2){ obj=null; }
    }
  }
  if(!obj){ showToast("Invalid JSON - clear box & paste again"); return; }
  if(obj.runs) runs=obj.runs;
  if(obj.metrics) metrics=obj.metrics;
  if(obj.missed) missed=obj.missed;
  if(obj.plan && Array.isArray(obj.plan) && obj.plan.length===PLAN_DATA.length) planSessions=obj.plan;
  saveRuns(); saveMetrics(); saveMissed(); savePlan();
  showToast("Imported!");
  dataPanel=false; render();
}
function copyBackup(){
  var data=JSON.stringify({runs:runs,metrics:metrics,plan:planSessions,missed:missed});
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(data).then(function(){showToast("Backup copied");}).catch(function(){fallbackCopy(data);});
  } else { fallbackCopy(data); }
}

function exportSummary(){
  var totalKm=0, totalRuns=0;
  for (var k in runs){ if(runs[k].km){ totalKm+=runs[k].km; totalRuns++; } }
  totalKm=Math.round(totalKm*10)/10;
  var lm=latestMetric();
  var mn=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var now=new Date();
  var out="SYDNEY MARATHON - LOG EXPORT\n";
  out+="Generated: "+now.getDate()+" "+mn[now.getMonth()]+" "+now.getFullYear()+"\n";
  out+="Total: "+totalKm+"km / "+totalRuns+" runs";
  if(lm) out+=" | VO2 "+lm.vo2+" | LT "+lm.lt+" | MP/LT "+ltPct(lm.lt)+"%";
  out+="\n------------------------------------\n";
  Object.keys(runs).sort().forEach(function(key){
    var r=runs[key]; if(!r.km) return;
    var wkNum="",session="",dayName="";
    for(var wi=0;wi<18;wi++){for(var di=0;di<7;di++){if(dateKey(wi,di)===key){wkNum="W"+PLAN_DATA[wi].week;session=getWeekSessions(wi)[di][0];dayName=DAY_NAMES[di];}}}
    var d=new Date(key+"T00:00:00");
    var line=dayName+" "+("0"+d.getDate()).slice(-2)+" "+mn[d.getMonth()]+" ("+wkNum+"): "+r.km+"km";
    if(r.pace) line+=" @ "+r.pace;
    if(r.hr) line+=" HR"+r.hr;
    if(session) line+=" [plan: "+session+"]";
    if(r.note) line+=" - "+r.note;
    out+=line+"\n";
  });
  var missList=Object.keys(missed).filter(function(k){ return missed[k] && !(runs[k]&&runs[k].km); }).sort();
  if(missList.length){
    out+="------------------------------------\nMISSED SESSIONS:\n";
    missList.forEach(function(key){
      var s="",dn="";
      for(var wi=0;wi<18;wi++){for(var di=0;di<7;di++){if(dateKey(wi,di)===key){s=getWeekSessions(wi)[di][0];dn=DAY_NAMES[di];}}}
      var d=new Date(key+"T00:00:00");
      out+=dn+" "+("0"+d.getDate()).slice(-2)+" "+mn[d.getMonth()]+": "+s+"\n";
    });
  }
  out+="------------------------------------\nPaste to Claude to sync + analyse.";
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(out).then(function(){showToast("Copied! Paste into Claude");}).catch(function(){fallbackCopy(out);});
  } else { fallbackCopy(out); }
}
function fallbackCopy(text){
  var t=document.getElementById("data-json");
  if(t){ t.value=text; t.select(); try{document.execCommand("copy");showToast("Copied!");}catch(e){} }
}

function showToast(msg){
  var ex=document.getElementById("toast"); if(ex) ex.remove();
  var t=document.createElement("div"); t.id="toast"; t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(function(){if(t)t.remove();},2500);
}

loadAll();
render();
document.addEventListener('pointerdown', onPointerDown);
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("service-worker.js").catch(function(){}); }
